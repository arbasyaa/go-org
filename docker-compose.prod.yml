# =============================================================================
# MyOrg — stack PRODUCTION (Dokploy)
# =============================================================================
# Setelan di Dokploy (Compose app):
#   Compose Path     : docker-compose.prod.yml
#   Environment      : tempel isi .env.example, isi yang kosong
#   Domains          : Host permikomnasjateng.teknostudio.id
#                      Service `frontend`, Container Port 3000, HTTPS on
#
# Port EXPOSE, bukan port publish. Tidak ada satu pun service yang bind ke host,
# jadi tidak ada rebutan port dengan aplikasi lain di server yang sama. Yang
# menembus `frontend:3000` adalah Traefik milik Dokploy.
# Dokploy menempelkan `dokploy-network` sendiri ke service yang diberi domain,
# makanya di sini tidak dideklarasikan: stack tetap jalan apa adanya kalau
# dijalankan tanpa Dokploy.
#
# Lokal: cp .env.example .env && docker compose -f docker-compose.prod.yml up -d --build
# =============================================================================

services:

  # ── Frontend (Next.js) — satu-satunya service yang dapat domain ────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # next.config.ts me-resolve rewrites saat build, jadi API_INTERNAL_URL
        # harus ikut sebagai build arg. Tanpa ini proxy /api/backend di-bake
        # menunjuk 127.0.0.1:8080 di dalam container frontend dan API mati.
        API_INTERNAL_URL: http://gokilbgt:8080
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_USE_DIRECT_API: ${NEXT_PUBLIC_USE_DIRECT_API:-}
    environment:
      # Hanya ini yang dibutuhkan frontend saat jalan. Sengaja TIDAK pakai
      # env_file: .env — tanpa itu JWT_SECRET dan password DB ikut nyangkut di
      # container yang menghadap publik, padahal tidak dipakai sama sekali.
      API_INTERNAL_URL: http://gokilbgt:8080
    expose:
      - "3000"
    depends_on:
      gokilbgt:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:3000/login").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - internal

  # ── Backend (Go + gokil) ──────────────────────────────────────────────────
  gokilbgt:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROJECT: backend
    environment:
      # Satu-satunya tempat password DB hidup. Menimpa apa pun di .env.
      GOKIL_DB_DSN: postgres://${GOKIL_DB_USER}:${GOKIL_DB_PASSWORD}@db:5432/${GOKIL_DB_NAME}?sslmode=disable
      OCR_SERVICE_URL: http://ocr:8090
    env_file:
      - .env
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ocr:
        condition: service_healthy
    volumes:
      # Tanpa volume ini semua upload (avatar, banner, lampiran, selfie absensi)
      # hilang tiap kali container di-rebuild / redeploy.
      - gokil_storage_permi:/app/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - internal

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${GOKIL_DB_USER}
      POSTGRES_PASSWORD: ${GOKIL_DB_PASSWORD}
      POSTGRES_DB: ${GOKIL_DB_NAME}
    volumes:
      - db_data_permi:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GOKIL_DB_USER} -d ${GOKIL_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data_permi:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  # ── OCR (ekstraksi teks PDF/gambar) ───────────────────────────────────────
  ocr:
    build:
      context: ./backend/ocr
    environment:
      OCR_LANG: ${OCR_LANG:-ind+eng}
      OCR_PDF_DPI: ${OCR_PDF_DPI:-200}
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    networks:
      - internal

  # ── MinIO (opsional, hanya kalau GOKIL_STORAGE_PROVIDER=s3) ────────────────
  # Butuh domain tambahan di Dokploy yang menunjuk service ini port 9000
  # (Traefik) supaya GOKIL_STORAGE_BASE_URL bisa dibuka browser.
  # minio:
  #   image: minio/minio:latest
  #   environment:
  #     MINIO_ROOT_USER: ${GOKIL_STORAGE_ACCESS_KEY_ID}
  #     MINIO_ROOT_PASSWORD: ${GOKIL_STORAGE_SECRET_ACCESS_KEY}
  #   command: server /data --console-address ":9001"
  #   expose:
  #     - "9000"
  #   volumes:
  #     - minio_data:/data
  #   restart: unless-stopped
  #   networks:
  #     - internal

volumes:
  # Nama eksplisit: tanpa ini Docker mem- prefix nama project (di Dokploy =
  # appName), jadi volume ikut berubah kalau app-nya di-rename dan data lama
  # "hilang" di balik volume baru yang kosong.
  db_data_permi:
    name: permikomnasjateng_db_data
  redis_data_permi:
    name: permikomnasjateng_redis_data
  gokil_storage_permi:
    name: permikomnasjateng_gokil_storage
  # minio_data:
  #   name: permikomnasjateng_minio_data

networks:
  internal:
    driver: bridge
